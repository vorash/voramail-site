<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal notice — voramail.org</title>
    <meta name="description" content="Legal notice (mentions légales) for voramail.org: publisher contact and hosting provider." />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vora-cr-theme");
          if (t !== "day" && t !== "night") t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
          document.documentElement.style.background = t === "night" ? "#0a0b0f" : "#f6f6f3";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/vora-mail-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" type="image/svg+xml" href="/vora-mail-icon.svg" />
    <link rel="apple-touch-icon" href="/vora-mail-apple-touch-icon.png" />
    <link rel="canonical" href="https://voramail.org/legal" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/legal/main.tsx"></script>
  </body>
</html>
